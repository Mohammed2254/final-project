# Render deployment blueprint for Farah.
# One web service (Flask serves the built React app + the API) plus a
# managed PostgreSQL database.
services:
  - type: web
    name: farah
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build
      cd "../back end" && pip install -r requirements.txt
    startCommand: cd "back end" && gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: farah-db
          property: connectionString

      # Secrets, set in the Render dashboard rather than committed here.
      # Declaring them with sync: false makes Render ask for a value at
      # deploy time instead of building a service that is quietly missing them.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Password-reset links point back here - set it to this service's URL.
      - key: FRONTEND_URL
        sync: false

      # Read by Vite during buildCommand and baked into the bundle. A
      # missing value does not fail the build, it ships a frontend where
      # image upload silently does nothing, so it belongs here too.
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false

databases:
  - name: farah-db
    plan: free
